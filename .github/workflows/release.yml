name: Release

# Builds installers for macOS (universal .dmg/.app), Windows (.msi + NSIS .exe) and
# Linux (.AppImage + .deb) and attaches them to a DRAFT GitHub Release.
#
# Secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           Updater signing key (see docs/releasing.md). Required
#                                       together with the public key in tauri.conf.json
#                                       (plugins.updater.pubkey); then .sig files and
#                                       `latest.json` are published. Neither set = no updater.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  Password of the key above.
#   macOS signing / notarization (optional, see the commented env block below):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID.
# Without Apple signing the macOS build is unsigned (users run `xattr -cr` or allow it in
# System Settings > Privacy & Security); see README.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows
            platform: windows-latest
            rust_targets: ''
            args: --bundles msi,nsis
          - name: Linux
            # Oldest supported Ubuntu runner: AppImage built here runs on more distros.
            platform: ubuntu-22.04
            rust_targets: ''
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      # Updater artifacts (.sig + latest.json) need BOTH the signing key secret and the
      # matching public key (+ real endpoint) in src-tauri/tauri.conf.json > plugins.updater.
      # Neither set: build without updater files. Only one of them set: fail, because the
      # release would ship updates the app cannot verify (or an app that expects updates
      # that are never published). See docs/releasing.md.
      - name: Detect updater configuration
        id: updater
        shell: bash
        run: |
          configured=$(node -e '
            const c = require("./src-tauri/tauri.conf.json").plugins?.updater ?? {};
            const key = (c.pubkey ?? "").trim();
            const eps = c.endpoints ?? [];
            const ok = key.length >= 40 && !/REPLACE/i.test(key) && eps.length > 0 &&
              eps.every(e => e.startsWith("https://") && !e.includes("/OWNER/"));
            process.stdout.write(ok ? "true" : "false");
          ')
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ] && [ "$configured" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          elif [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ] && [ "$configured" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::Updater not configured (no signing key, no public key): building without updater artifacts"
          elif [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::plugins.updater.pubkey is set but the TAURI_SIGNING_PRIVATE_KEY secret is missing"
            exit 1
          else
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater (pubkey / endpoint without OWNER) is not configured in tauri.conf.json"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing and notarization (optional):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: StarlinkPulse v__VERSION__
          releaseBody: |
            See the assets below for macOS (universal), Windows and Linux.
            Unsigned builds: see the README for Gatekeeper / SmartScreen instructions.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.updater.outputs.enabled == 'true' }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
