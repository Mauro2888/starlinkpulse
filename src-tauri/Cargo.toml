[package]
name = "starlinkpulse"
version = "0.1.0"
description = "Lightweight cross-platform Starlink monitor with AI diagnostics"
authors = ["StarlinkPulse contributors"]
license = "MIT"
repository = "https://github.com/OWNER/StarlinkPulse"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "starlinkpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.14.9"
prost = "0.14.6"
prost-types = "0.14.6"
prost-reflect = { version = "0.16.5", features = ["serde"] }
tokio = { version = "1.54.1", features = ["full"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tonic-reflection = { version = "0.14.9", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
