<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>StarlinkPulse</title>
<style>
html,body{margin:0;padding:0;background:#0b0f14;color:#e6edf3;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{padding:2vw 2.5vw;}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1.5vw;}
.brand{font-size:2.2vw;font-weight:600;color:#8b98a5;}
.pill{display:inline-block;font-size:2.4vw;font-weight:700;padding:.4vw 1.6vw;border-radius:3vw;background:#1f2937;}
.ok{color:#3fb950;} .warn{color:#d29922;} .bad{color:#f85149;} .muted{color:#8b98a5;}
.pill.ok{background:#12301c;} .pill.warn{background:#3a2c0b;} .pill.bad{background:#3d1416;}
.grid{display:flex;flex-wrap:wrap;margin:0 -0.6vw;}
.tile{box-sizing:border-box;width:25%;padding:.6vw;}
.tile.wide{width:50%;}
.card{background:#151b23;border:1px solid #232c37;border-radius:1vw;padding:1.2vw 1.4vw;height:100%;box-sizing:border-box;}
.label{font-size:1.5vw;color:#8b98a5;text-transform:uppercase;letter-spacing:.08em;}
.value{font-size:5.4vw;font-weight:700;line-height:1.1;margin-top:.3vw;white-space:nowrap;}
.unit{font-size:2vw;font-weight:500;color:#8b98a5;margin-left:.4vw;}
.small{font-size:2.2vw;line-height:1.35;margin-top:.5vw;}
.row{display:flex;justify-content:space-between;}
.foot{margin-top:1.2vw;font-size:1.4vw;color:#6e7681;text-align:right;}
.msg{font-size:2.4vw;margin:1vw 0;}
@media (max-width:820px){
  body{padding:4vw;}
  .brand{font-size:5vw;} .pill{font-size:5vw;padding:1vw 3vw;border-radius:6vw;}
  .tile{width:50%;padding:1.2vw;} .tile.wide{width:100%;}
  .card{border-radius:3vw;padding:3vw;}
  .label{font-size:3.4vw;} .value{font-size:10vw;} .unit{font-size:4vw;}
  .small{font-size:4.6vw;} .foot{font-size:3.2vw;margin-top:3vw;} .msg{font-size:4.6vw;}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">StarlinkPulse</div>
  <div id="state" class="pill muted">&hellip;</div>
</div>
<div id="msg" class="msg warn" style="display:none"></div>
<div class="grid">
  <div class="tile"><div class="card"><div class="label" data-t="down"></div><div class="value"><span id="down">&ndash;</span><span class="unit">Mbps</span></div></div></div>
  <div class="tile"><div class="card"><div class="label" data-t="up"></div><div class="value"><span id="up">&ndash;</span><span class="unit">Mbps</span></div></div></div>
  <div class="tile"><div class="card"><div class="label" data-t="latency"></div><div class="value"><span id="lat">&ndash;</span><span class="unit">ms</span></div></div></div>
  <div class="tile"><div class="card"><div class="label" data-t="loss"></div><div class="value"><span id="loss">&ndash;</span><span class="unit">%</span></div></div></div>
  <div class="tile"><div class="card"><div class="label" data-t="obstruction"></div><div class="value"><span id="obs">&ndash;</span><span class="unit">%</span></div></div></div>
  <div class="tile"><div class="card"><div class="label" data-t="jitter"></div><div class="value"><span id="jit">&ndash;</span><span class="unit">ms</span></div></div></div>
  <div class="tile"><div class="card"><div class="label" data-t="uptime"></div><div class="value"><span id="upt">&ndash;</span><span class="unit">%</span></div></div></div>
  <div class="tile"><div class="card"><div class="label" data-t="readiness"></div>
    <div class="small row"><span data-t="video"></span><b id="r_video">&ndash;</b></div>
    <div class="small row"><span data-t="gaming"></span><b id="r_gaming">&ndash;</b></div>
    <div class="small row"><span data-t="streaming"></span><b id="r_streaming">&ndash;</b></div>
  </div></div>
  <div class="tile wide"><div class="card"><div class="label" data-t="lastOutage"></div><div id="outage" class="small">&ndash;</div></div></div>
  <div class="tile wide"><div class="card"><div class="label" data-t="alerts"></div><div id="alerts" class="small">&ndash;</div></div></div>
</div>
<div class="foot"><span data-t="readOnly"></span> &middot; <span id="updated"></span></div>
<script>
(function () {
  var T = {
    en: { down: "Download", up: "Upload", latency: "Latency", loss: "Ping loss", obstruction: "Obstruction",
      jitter: "Jitter", uptime: "Uptime 24 h", readiness: "Ready for", video: "Video calls", gaming: "Gaming",
      streaming: "Streaming", lastOutage: "Last outage", alerts: "Alerts", none: "None",
      readOnly: "Read-only view", updated: "Updated", connected: "Online", connecting: "Connecting",
      offline: "Offline", mock: "Simulated", good: "Good", fair: "Fair", poor: "Poor", ago: "ago",
      lasting: "lasting", lost: "Cannot reach StarlinkPulse. Retrying…",
      forbidden: "The access code is not valid any more. Scan the new QR code in StarlinkPulse." },
    it: { down: "Download", up: "Upload", latency: "Latenza", loss: "Ping persi", obstruction: "Ostruzione",
      jitter: "Jitter", uptime: "Disponibilità 24 h", readiness: "Adatta a", video: "Videochiamate",
      gaming: "Giochi", streaming: "Streaming", lastOutage: "Ultima interruzione", alerts: "Avvisi",
      none: "Nessuno", readOnly: "Vista in sola lettura", updated: "Aggiornato", connected: "Online",
      connecting: "Connessione", offline: "Offline", mock: "Simulato", good: "Buona", fair: "Discreta",
      poor: "Scarsa", ago: "fa", lasting: "durata", lost: "StarlinkPulse non raggiungibile. Nuovo tentativo…",
      forbidden: "Il codice di accesso non è più valido. Scansiona il nuovo QR code in StarlinkPulse." }
  };
  var nav = (navigator.language || "en").toLowerCase();
  var lang = nav.indexOf("it") === 0 ? "it" : "en";
  var m = /[?&]k=([^&#]*)/.exec(window.location.search);
  var key = m ? m[1] : "";
  function t(k) { return (T[lang] && T[lang][k]) || T.en[k] || k; }
  function $(id) { return document.getElementById(id); }
  function text(id, v) { $(id).textContent = v; }
  function applyLabels() {
    var els = document.querySelectorAll("[data-t]");
    for (var i = 0; i < els.length; i++) { els[i].textContent = t(els[i].getAttribute("data-t")); }
    document.documentElement.lang = lang;
  }
  function num(v, d) {
    if (v === null || v === undefined || isNaN(v)) { return "–"; }
    var s = Number(v).toFixed(d);
    return lang === "it" ? s.replace(".", ",") : s;
  }
  function dur(s) {
    s = Math.max(0, Math.round(s));
    if (s < 60) { return s + " s"; }
    if (s < 3600) { return Math.floor(s / 60) + " min " + (s % 60) + " s"; }
    if (s < 172800) { return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min"; }
    return Math.floor(s / 86400) + " d";
  }
  function level(id, l) {
    var el = $(id);
    el.textContent = l ? t(l) : "–";
    el.className = l === "good" ? "ok" : l === "fair" ? "warn" : l === "poor" ? "bad" : "muted";
  }
  function msg(s) { var el = $("msg"); el.textContent = s || ""; el.style.display = s ? "block" : "none"; }
  function render(d) {
    if (d.lang && T[d.lang] && d.lang !== lang) { lang = d.lang; applyLabels(); }
    var st = $("state");
    st.textContent = t(d.state);
    st.className = "pill " + (d.state === "connected" ? "ok" : d.state === "offline" ? "bad" : "warn");
    text("down", num(d.downMbps, 1)); text("up", num(d.upMbps, 1));
    text("lat", num(d.latencyMs, 0)); text("loss", num(d.lossPct, 1));
    text("obs", num(d.obstructionPct, 1)); text("jit", num(d.jitterMs, 0));
    text("upt", num(d.uptime24hPct, 2));
    var r = d.readiness || {};
    level("r_video", r.videoCall); level("r_gaming", r.gaming); level("r_streaming", r.streaming);
    var o = d.lastOutage;
    if (o) {
      var ago = (d.nowMs - o.startMs) / 1000;
      text("outage", o.cause + " · " + dur(ago) + " " + t("ago") + " · " + t("lasting") + " " + dur(o.durationS));
    } else { text("outage", t("none")); }
    text("alerts", d.alerts && d.alerts.length ? d.alerts.join(", ") : t("none"));
    $("alerts").className = "small " + (d.alerts && d.alerts.length ? "warn" : "");
    var now = new Date();
    text("updated", t("updated") + " " + (now.getHours() < 10 ? "0" : "") + now.getHours() + ":" +
      (now.getMinutes() < 10 ? "0" : "") + now.getMinutes() + ":" + (now.getSeconds() < 10 ? "0" : "") + now.getSeconds());
  }
  function poll() {
    var x = new XMLHttpRequest();
    x.open("GET", "/api/status?k=" + encodeURIComponent(key), true);
    x.timeout = 5000;
    x.onreadystatechange = function () {
      if (x.readyState !== 4) { return; }
      if (x.status === 200) {
        try { render(JSON.parse(x.responseText)); msg(""); } catch (e) { msg(t("lost")); }
      } else if (x.status === 403) {
        msg(t("forbidden"));
      } else {
        msg(t("lost"));
      }
    };
    try { x.send(); } catch (e) { msg(t("lost")); }
  }
  applyLabels();
  poll();
  setInterval(poll, 3000);
})();
</script>
</body>
</html>
